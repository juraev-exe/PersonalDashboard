name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lifeos

    steps:
      - uses: actions/checkout@v4

      # jsdom 30 (via its bundled undici) calls webidl.util.markAsUncloneable,
      # which does not exist before Node 22 — its engines field requires
      # ^22.22.2 || ^24.15.0 || >=26.0.0.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lifeos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
